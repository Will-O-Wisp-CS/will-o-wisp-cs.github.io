name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 毎日 0:00 JST に大会スケジュールを取得し（大会の記録も更新）、変更があればコミットしてデプロイする
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch CS schedule
        id: fetch
        if: github.event_name != 'push'
        run: |
          npm run fetch-schedule
          if git diff --quiet -- src/shared/events.json src/shared/events-archive.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/shared/events.json src/shared/events-archive.json
            git commit -m 'chore: update CS schedule'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # push と手動実行は常にデプロイ、定期実行はスケジュールが変わったときだけ
      - name: Decide deploy
        id: decide
        run: echo "deploy=${{ github.event_name != 'schedule' || steps.fetch.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.deploy == 'true'
        run: npm test
      - if: steps.decide.outputs.deploy == 'true'
        run: npm run build
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
